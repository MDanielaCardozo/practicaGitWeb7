<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practica de git y github" />
    <meta name="keywords" content="git, github, commit" />
    <meta
      name="author"
      content="Octavio Fernandez, Marisol Lamas, Mauro Seu, Abel Ruiz, Ornella Ricobelli, Leandro Blanca, Gonzalo Tabares."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <title>Practica git y github grupal</title>
  </head>

  <body>
    <header></header>

    <main class="d-flex justify-content-center align-items-center py-5">
      <form
        class="p-4 p-md-5 rounded-4 shadow-sm bg-light w-100"
        style="max-width: 600px"
      >
        <h2 class="mb-4 text-center">Contacto</h2>

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            placeholder="Ingrese su nombre completo"
            required
          />
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="correo"
            placeholder="Ingrese su correo electrónico"
            required
          />
        </div>

        <div class="mb-3">
          <label for="asunto" class="form-label">Asunto</label>
          <input
            type="text"
            class="form-control"
            id="asunto"
            placeholder="Ingrese el asunto"
            required
          />
        </div>

        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea
            class="form-control"
            id="mensaje"
            rows="4"
            placeholder="Escriba su mensaje aquí..."
            required
          ></textarea>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary mt-3">
            Enviar mensaje
          </button>
        </div>
      </form>
    </main>

    <footer class="text-center py-3 bg-dark text-white mt-auto">
      <p class="mb-0">© Derechos reservados - 2025</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
