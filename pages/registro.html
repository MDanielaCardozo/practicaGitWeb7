<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practica de git y github">
    <meta name="keywords" content="git, github, commit">
    <meta name="author" content="Octavio Fernandez, Marisol Lamas, Mauro Seu, Abel Ruiz, Ornella Ricobelli, Leandro Blanca, Gonzalo Tabares.">
    <link rel="stylesheet" href="./css/style.css">
    <title>Practica git y github grupal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
<body>
   <header></header> 

   <main>
     <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-lg rounded-4">
            <div class="card-body p-4">
              <h2 class="text-center mb-4 text-primary">Registro de Usuario</h2>

              <form>
               
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre completo</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    placeholder="Tu nombre"
                    required
                  />
                </div>

                
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="ejemplo@correo.com"
                    required
                  />
                </div>

                
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Crea una contraseña"
                    required
                  />
                </div>

          
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label"
                    >Confirmar contraseña</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    placeholder="Repite la contraseña"
                    required
                  />
                </div>

               
                <div class="mb-3">
                  <label for="fechaNacimiento" class="form-label"
                    >Fecha de nacimiento</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="fechaNacimiento"
                    required
                  />
                </div>

                
                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="terminos"
                    required
                  />
                  <label class="form-check-label" for="terminos">
                    Acepto los <a href="#">términos y condiciones</a>
                  </label>
                </div>

                
                <button type="submit" class="btn btn-primary w-100">
                  Registrarme
                </button>
              </form>

              <p class="text-center mt-3">
                ¿Ya tienes cuenta?
                <a href="#">Inicia sesión</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 </main>
<footer> 
        <p>@ Derechos reservados - 2025 </p>
    </footer>
</body>

</html>
